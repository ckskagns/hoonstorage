<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>우리둘</title>
  <style>
    :root { --bg: #fff8f8; --text: #22191c; --sub: #74565f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #191113; --text: #f0dee2; --sub: #d6c1c6; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
      color: var(--text); font-family: -apple-system, "Noto Sans KR", sans-serif; padding: 16px; text-align: center; }
    p { color: var(--sub); }
  </style>
</head>
<body>
  <div>
    <div style="font-size:48px">💕</div>
    <h1>우리둘</h1>
    <p>두 사람만의 공간이에요.</p>
  </div>
</body>
</html>
